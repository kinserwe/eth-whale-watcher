services:
  bot:
    build: .
    command: python -m app.bot
    restart: always
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
  scanner:
    build: .
    command: python -m app.main
    restart: always
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
  migrate:
    build: .
    command: alembic upgrade head
    restart: no
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
  db:
    image: postgres:17
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      retries: 5
      interval: 5s
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
