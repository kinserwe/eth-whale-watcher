services:
  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5435:5432"
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
volumes:
  db-data:
  redis-data:
